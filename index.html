<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef6fa">
<meta name="application-name" content="풍무동성당">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="풍무동성당">
<title>풍무동성당</title>
<link rel="manifest" href="/pungmu-parish-pwa/manifest.webmanifest">
<link rel="icon" href="/pungmu-parish-pwa/icons/icon-192.png">
<link rel="apple-touch-icon" href="/pungmu-parish-pwa/icons/icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#eef6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}
#installBar{position:fixed;z-index:99999;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;padding:10px 11px;background:#fff;border:1px solid #d6e2e7;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.18)}
#installBar img{width:40px;height:40px;object-fit:contain}
#installCopy{flex:1;min-width:0}
#installCopy b{display:block;font-size:14px;color:#20343e}
#installCopy small{display:block;margin-top:2px;font-size:11px;color:#65777f}
#installBtn{border:0;border-radius:10px;padding:10px 13px;background:#356b7d;color:#fff;font-weight:800}
#guide{position:fixed;z-index:100000;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.38)}
#guideBox{width:min(360px,100%);background:#fff;border-radius:18px;padding:21px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
#guideBox h3{margin:0 0 10px;color:#20343e;font-size:19px}
#guideBox p{margin:0;color:#52646c;font-size:14px;line-height:1.65}
#guideBox button{width:100%;margin-top:16px;border:0;border-radius:11px;padding:12px;background:#356b7d;color:#fff;font-weight:800}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzkWUR-IBm2mFR0Kc8u2FzlZf_wuy4nm5Asj6O85pAcAUU0vHKpkmYvzvJJu2nwyjWI/exec" allow="clipboard-write"></iframe>

<div id="installBar">
  <img src="/pungmu-parish-pwa/icons/icon-192.png" alt="">
  <div id="installCopy">
    <b>풍무동성당 앱 설치</b>
    <small>홈 화면에서 바로 이용하세요.</small>
  </div>
  <button id="installBtn">설치</button>
</div>

<div id="guide">
  <div id="guideBox">
    <h3>풍무동성당 앱 설치</h3>
    <p id="guideText"></p>
    <button id="guideClose">확인</button>
  </div>
</div>

<script>
let deferredPrompt = null;
const bar = document.getElementById('installBar');
const btn = document.getElementById('installBtn');
const guide = document.getElementById('guide');
const guideText = document.getElementById('guideText');

function standalone() {
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true ||
         document.referrer.startsWith('android-app://');
}

// 설치된 PWA에서 실행했을 때만 설치바 숨김.
// 일반 브라우저에서는 페이지 로딩과 관계없이 HTML 자체가 즉시 표시됨.
if (standalone()) bar.style.display = 'none';

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
});

window.addEventListener('appinstalled', () => {
  bar.style.display = 'none';
  deferredPrompt = null;
});

btn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    return;
  }

  const ua = navigator.userAgent;
  if (/SamsungBrowser/i.test(ua)) {
    guideText.innerHTML = '삼성 인터넷에서 주소창 옆 <b>풍무동성당 아이콘</b>을 누르거나, 메뉴에서 <b>현재 페이지 추가 → 앱스 화면</b>을 선택해 주세요.';
  } else if (/Chrome/i.test(ua)) {
    guideText.innerHTML = 'Chrome 오른쪽 위 <b>⋮</b> → <b>설치 및 바로가기 만들기</b> → <b>앱 설치</b>를 선택해 주세요.';
  } else {
    guideText.innerHTML = '브라우저 메뉴에서 <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 선택해 주세요.';
  }
  guide.style.display = 'flex';
});

document.getElementById('guideClose').addEventListener('click', () => guide.style.display='none');

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/pungmu-parish-pwa/sw.js', {scope:'/pungmu-parish-pwa/'}).catch(()=>{});
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef6fa">
<meta name="application-name" content="풍무동성당">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="풍무동성당">
<title>풍무동성당</title>
<link rel="manifest" href="/pungmu-parish-pwa/manifest.webmanifest">
<link rel="icon" href="/pungmu-parish-pwa/icons/icon-192.png">
<link rel="apple-touch-icon" href="/pungmu-parish-pwa/icons/icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#eef6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#installBar{position:fixed;z-index:99999;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;padding:10px 11px;background:#fff;border:1px solid #d6e2e7;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.18)}
#installBar img{width:40px;height:40px;object-fit:contain}
#installDismiss{flex:0 0 auto;border:0;background:transparent;color:#64757d;font-size:24px;line-height:1;width:30px;height:36px;cursor:pointer}
#copy{flex:1;min-width:0}
#copy b{display:block;font-size:14px;color:#20343e}
#copy small{display:block;margin-top:2px;font-size:11px;color:#65777f;line-height:1.35}
#action{border:0;border-radius:10px;padding:10px 13px;background:#356b7d;color:#fff;font-weight:800;white-space:nowrap}
#guide{position:fixed;z-index:100000;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.38)}
#guideBox{width:min(370px,100%);background:#fff;border-radius:18px;padding:21px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
#guideBox h3{margin:0 0 10px;color:#20343e;font-size:19px}
#guideBox p{margin:0;color:#52646c;font-size:14px;line-height:1.7}
#guideBox button{width:100%;margin-top:16px;border:0;border-radius:11px;padding:12px;background:#356b7d;color:#fff;font-weight:800}

#pushBar{position:fixed;z-index:100001;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:10px;padding:13px;background:white;border:1px solid #cbdde2;border-radius:14px;box-shadow:0 5px 20px rgba(0,0,0,.18)}
#pushBar span{flex:1;font-size:13px;color:#20343e}
#pushEnable{background:#356b7d;color:#fff;border:0;border-radius:9px;padding:10px;font-weight:700}
#pushDismiss{background:transparent;border:0;font-size:22px;color:#64757d}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzkWUR-IBm2mFR0Kc8u2FzlZf_wuy4nm5Asj6O85pAcAUU0vHKpkmYvzvJJu2nwyjWI/exec" allow="clipboard-write"></iframe>

<div id="installBar">
 <img src="/pungmu-parish-pwa/icons/icon-192.png" alt="">
 <div id="copy"><b id="barTitle">풍무동성당 앱 설치</b><small id="barText">홈 화면에서 바로 이용하세요.</small></div>
 <button id="action" type="button">설치</button>
 <button id="installDismiss" type="button" aria-label="설치 안내 닫기">×</button>
</div>

<div id="pushBar"><span>관리자 푸시 알림을 이 기기에서 받으시겠습니까?</span><button id="pushEnable" type="button">알림 받기</button><button id="pushDismiss" type="button" aria-label="닫기">×</button></div>

<div id="guide"><div id="guideBox">
 <h3 id="guideTitle">풍무동성당 앱 설치</h3>
 <p id="guideText"></p>
 <button id="guideClose" type="button">확인</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script>
let deferredPrompt=null;
const ua=navigator.userAgent;
const isIOS=/iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isSamsung=/SamsungBrowser/i.test(ua);
const isAndroid=/Android/i.test(ua);
const isChromeAndroid=isAndroid && /Chrome/i.test(ua) && !isSamsung;
const bar=document.getElementById('installBar');
const action=document.getElementById('action');
const barText=document.getElementById('barText');
const guide=document.getElementById('guide');
const guideText=document.getElementById('guideText');

function standalone(){
 return window.matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone===true ||
        document.referrer.startsWith('android-app://');
}
const INSTALL_DISMISSED_KEY='pungmu-install-banner-dismissed-v1';
function hideInstallBar(){bar.style.display='none';}
try { if(localStorage.getItem(INSTALL_DISMISSED_KEY)==='1') hideInstallBar(); } catch(e) {}
if(standalone()) hideInstallBar();
document.getElementById('installDismiss').addEventListener('click',()=>{
  try { localStorage.setItem(INSTALL_DISMISSED_KEY,'1'); } catch(e) {}
  hideInstallBar();
});

if(isIOS){
 barText.textContent='iPhone은 Safari에서 홈 화면에 추가합니다.';
 action.textContent='설치 안내';
} else if(isSamsung){
 barText.textContent='안전한 설치를 위해 Chrome 사용을 권장합니다.';
 action.textContent='설치 안내';
} else if(isChromeAndroid){
 barText.textContent='Chrome에서 안전하게 앱으로 설치할 수 있습니다.';
 action.textContent='설치';
} else if(isAndroid){
 barText.textContent='Chrome에서 열어 설치하는 것을 권장합니다.';
 action.textContent='설치 안내';
} else {
 barText.textContent='휴대폰에서 앱으로 설치할 수 있습니다.';
 action.textContent='설치 안내';
}

window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault();
 deferredPrompt=e;
});
window.addEventListener('appinstalled',()=>{
  try { localStorage.setItem(INSTALL_DISMISSED_KEY,'1'); } catch(e) {}
  hideInstallBar();deferredPrompt=null;
});

action.addEventListener('click',async()=>{
 if(isChromeAndroid && deferredPrompt){
   deferredPrompt.prompt();
   await deferredPrompt.userChoice;
   deferredPrompt=null;
   return;
 }
 if(isIOS){
   guideText.innerHTML='① 이 주소를 <b>Safari</b>에서 여세요.<br>② Safari의 <b>공유 버튼</b>을 누르세요.<br>③ <b>홈 화면에 추가</b>를 선택하세요.<br>④ <b>추가</b>를 누르면 풍무동성당 아이콘이 생성됩니다.';
 } else if(isSamsung){
   guideText.innerHTML='<b>삼성 인터넷에서 직접 설치하면 기기에 따라 Play Protect 경고가 표시될 수 있습니다.</b><br><br>Chrome에서 이 페이지를 연 뒤<br><b>⋮ → 설치 및 바로가기 만들기 → 앱 설치</b>를 이용해 주세요.';
 } else if(isAndroid){
   guideText.innerHTML='이 페이지를 <b>Chrome</b>에서 연 뒤<br><b>⋮ → 설치 및 바로가기 만들기 → 앱 설치</b>를 선택해 주세요.';
 } else {
   guideText.innerHTML='Android는 <b>Chrome</b>, iPhone은 <b>Safari</b>에서 이 페이지를 열어 설치해 주세요.';
 }
 guide.style.display='flex';
});
document.getElementById('guideClose').onclick=()=>guide.style.display='none';

if('serviceWorker' in navigator){
 navigator.serviceWorker.register('/pungmu-parish-pwa/sw.js',{scope:'/pungmu-parish-pwa/'}).catch(()=>{});
}

// PUNGMU PUSH: GitHub shell <-> GAS iframe bridge
const PUSH_CHANNEL='PUNGMU_PUSH_V1';
const PUSH_VAPID='BNoYNNbya-SKTzuSCHs_qsHMpZW-jrfkssi2Y_JmNEynzfjqqTvBi0vvtYSIUP0WLF4tZTglVBpxdzQIR_61Cs0';
const PUSH_CONFIG={apiKey:'AIzaSyABX1iZ5Kq7zwcr22faMapM5IUhP86amNo',authDomain:'pungmu-parish-pwa.firebaseapp.com',projectId:'pungmu-parish-pwa',storageBucket:'pungmu-parish-pwa.firebasestorage.app',messagingSenderId:'391478026636',appId:'1:391478026636:web:5cc77ea9ce109b565eb6a9'};
const pushBar=document.getElementById('pushBar');
const pushEnable=document.getElementById('pushEnable');
const pushDismiss=document.getElementById('pushDismiss');
const appFrame=document.getElementById('app');
let pushAdmin=false, pushBusy=false, pushMessaging=null, pushSaved=false, pushFrameOrigin=null;
let pushSaveTimer=null, pushLastToken=null;
const PUSH_DISMISS_KEY='pungmu-push-dismissed-session';
function pushHide(){pushBar.style.display='none';if(!standalone()){try{if(localStorage.getItem(INSTALL_DISMISSED_KEY)!=='1')bar.style.display='flex';}catch(e){bar.style.display='flex';}}}
function pushShow(){
 if(!pushAdmin||pushSaved||pushBusy||!('Notification' in window)||Notification.permission==='denied')return;
 try{if(sessionStorage.getItem(PUSH_DISMISS_KEY)==='1')return;}catch(e){}
 bar.style.display='none';
 pushBar.style.display='flex';
}
function pushInit(){
 if(pushMessaging)return pushMessaging;
 if(!window.firebase||!firebase.messaging||!firebase.messaging.isSupported())throw new Error('이 브라우저는 FCM을 지원하지 않습니다.');
 if(!firebase.apps.length)firebase.initializeApp(PUSH_CONFIG);
 pushMessaging=firebase.messaging();
 pushMessaging.onMessage(payload=>{
  // Foreground messages may not display system notifications automatically.
  console.info('[PUSH] 포그라운드 메시지 수신',payload?.messageId||'');
  const n=payload?.notification||{};
  navigator.serviceWorker.ready.then(reg=>reg.showNotification(n.title||'풍무동성당 알림',{body:n.body||'새로운 알림이 도착했습니다.',icon:'/pungmu-parish-pwa/icons/icon-192.png',data:{url:payload?.fcmOptions?.link||'/pungmu-parish-pwa/'},tag:payload?.messageId||'pungmu-admin-push'})).catch(e=>console.warn('[PUSH] 화면 알림 표시 실패',e));
 });
 return pushMessaging;
}
async function pushRegister(){
 if(!pushAdmin||pushBusy)return;
 pushBusy=true;pushHide();
 try{
  if(!('serviceWorker' in navigator)||!('Notification' in window))throw new Error('이 기기는 웹 푸시를 지원하지 않습니다.');
  if(Notification.permission!=='granted'){
   const permission=await Notification.requestPermission();
   if(permission!=='granted')throw new Error('알림 권한이 허용되지 않았습니다.');
  }
  const registration=await navigator.serviceWorker.register('/pungmu-parish-pwa/sw.js',{scope:'/pungmu-parish-pwa/'});
  const messaging=pushInit();
  const token=await messaging.getToken({vapidKey:PUSH_VAPID,serviceWorkerRegistration:registration});
  if(!token)throw new Error('FCM 토큰을 발급받지 못했습니다.');
  appFrame.contentWindow.postMessage({channel:PUSH_CHANNEL,type:'REGISTER_TOKEN',token},pushFrameOrigin||'*');
  // SAVE_RESULT response confirms storage; do not mark registered before then.
 }catch(err){console.error('[PUSH] 등록 실패',err);alert('푸시 등록 실패: '+(err?.message||err));}
 finally{pushBusy=false;}
}
pushEnable.addEventListener('click',pushRegister);
pushDismiss.addEventListener('click',()=>{try{sessionStorage.setItem(PUSH_DISMISS_KEY,'1')}catch(e){}pushHide()});
window.addEventListener('message',event=>{
 if(event.source!==appFrame.contentWindow||!event.data||event.data.channel!==PUSH_CHANNEL)return;
 const d=event.data;
 if(d.type==='ADMIN_READY'){
  console.info('[PUSH] ADMIN_READY 수신',event.origin);
  pushFrameOrigin=event.origin;
  pushAdmin=true;pushSaved=false;
  if('Notification' in window&&Notification.permission==='granted')pushRegister();
  else pushShow();
 }else if(d.type==='ADMIN_LOGOUT'){
  console.info('[PUSH] ADMIN_LOGOUT 수신');
  clearTimeout(pushSaveTimer);pushAdmin=false;pushSaved=false;pushHide();
 }else if(d.type==='SAVE_RESULT'){
  clearTimeout(pushSaveTimer);
  if(d.ok){pushSaved=true;pushHide();console.info('[PUSH] 기기 등록 완료');}
  else {console.warn('[PUSH] 기기 저장 실패',d.message||'');pushShow();}
 }
});
</script>
</body>
</html>

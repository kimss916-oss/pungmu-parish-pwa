<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#eef6fa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="풍무동성당">
  <meta name="application-name" content="풍무동성당">
  <title>풍무동성당</title>
  <link rel="manifest" href="/pungmu-parish-pwa/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/pungmu-parish-pwa/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/pungmu-parish-pwa/icons/icon-192.png">
  <style>
    html,body{width:100%;height:100%;margin:0;background:#eef6fa;overflow:hidden}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#eef6fa;color:#29485b;
      font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-weight:700;z-index:2}
  </style>
</head>
<body>
  <div id="loading">풍무동성당</div>
  <iframe id="app" title="천주교 풍무동성당"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const APP_URL='https://script.google.com/macros/s/AKfycbzkWUR-IBm2mFR0Kc8u2FzlZf_wuy4nm5Asj6O85pAcAUU0vHKpkmYvzvJJu2nwyjWI/exec';
    const frame=document.getElementById('app');
    frame.src=APP_URL;
    frame.addEventListener('load',()=>document.getElementById('loading').style.display='none');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/pungmu-parish-pwa/sw.js', {
            scope: '/pungmu-parish-pwa/'
          });
          reg.update();
        } catch (e) {
          console.error('service worker registration failed', e);
        }
      });
    }
  </script>
</body>
</html>
